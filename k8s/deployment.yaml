
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payanam-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payanam
  template:
    metadata:
      labels:
        app: payanam
    spec:
      containers:
        - name: payanam-container
          image: payanam-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
